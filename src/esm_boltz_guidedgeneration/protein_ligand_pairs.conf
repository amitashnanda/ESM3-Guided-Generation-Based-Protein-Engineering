# ====================
# Protein-Ligand Pairs Configuration
# ====================
# Format: PDB_ID,CHAIN_ID,SMILES,MASKING_PCT,NUM_DECODING_STEPS,NUM_SAMPLES,ESM_MODEL,CACHE_DIR,SCORE_TYPE,USE_MSA_SERVER,TIME_LIMIT,CPUS,MEM
#
# Required fields:
#   - PDB_ID: Protein PDB identifier (e.g., 1RNT)
#   - CHAIN_ID: Chain identifier (e.g., A)
#   - SMILES: Ligand SMILES string (Type: Canonical SMILES Program: CACTVS)
#
# Optional fields (with defaults):
#   - MASKING_PCT: Masking percentage (default: 0.4)
#   - NUM_DECODING_STEPS: Number of decoding steps (default: 32)
#   - NUM_SAMPLES: Number of samples per step (default: 10)
#   - ESM_MODEL: ESM3 model - local, esm3-medium-2024-08, esm3-large (default: local)
#   - CACHE_DIR: Cache directory for Boltz results (default: auto-generated)
#   - SCORE_TYPE: Scoring type - affinity or binary (default: affinity)
#   - USE_MSA_SERVER: Use MSA server - true or false (default: false)
#   - TIME_LIMIT: SLURM time limit in HH:MM:SS format (default: 15:00:00)
#   - CPUS: Number of CPUs per job (default: 8)
#   - MEM: Memory per job, e.g. 16G, 32G (default: 16G)
# ====================

# Example entries (modify or replace with your protein-ligand pairs):
